
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>SVG координатна площина</title>
    <style>
        body {
            font-family: "Times New Roman";
            text-align: center;
            background: #f4f4f9;
        }

        svg {
            background: white;
            border: 1px solid #ccc;
        }

        .shape {
            fill: #4fc11a;
            stroke: #006f1c;
            stroke-width: 1.5;
        }
    </style>
</head>
<body>

<h2>Координатна площина</h2>

<svg width="680" height="400" viewBox="-230 -180 620 360" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <path id="textCurve"
              d="M -180,-145 Q 90,-175 330,-145"
              fill="none"/>
    </defs>

    <line x1="-220" y1="0" x2="365" y2="0"
          stroke="black" stroke-width="1.5"/>
    <polygon points="365,-5 375,0 365,5" fill="black"/>
    <text x="360" y="22" font-size="20">X</text>

    <line x1="0" y1="155" x2="0" y2="-155"
          stroke="black" stroke-width="1.5"/>
    <polygon points="-5,-155 0,-165 5,-155" fill="black"/>
    <text x="15" y="-140" font-size="20">Y</text>

    <g font-size="18" fill="black">
        <text x="-195" y="23">-3</text>
        <text x="-135" y="23">-2</text>
        <text x="-75" y="23">-1</text>
        <text x="-15" y="23">0</text>
        <text x="45" y="23">1</text>
        <text x="105" y="23">2</text>
        <text x="165" y="23">3</text>
        <text x="225" y="23">4</text>
        <text x="285" y="23">5</text>
        <text x="-18" y="-102">2</text>
        <text x="-18" y="-42">1</text>
        <text x="-24" y="78">-1</text>
        <text x="-24" y="138">-2</text>
    </g>

    <g stroke="black" stroke-width="1.5">
        <path d="M-180,-8 V8 M-120,-8 V8 M-60,-8 V8
        M60,-8 V8 M120,-8 V8 M180,-8 V8
        M240,-8 V8 M300,-8 V8
        M-10,-120 H10 M-10,-60 H10
        M-10,60 H10 M-10,120 H10"/>
    </g>

    <rect x="-180" y="-60" width="60" height="60" class="shape">
        <animate attributeName="fill"
                 values="#ff0000;#ff9900;#ffff00;#ff0000"
                 dur="4s" repeatCount="indefinite"/>
        <animate attributeName="x"
                 values="-180;-170;-190;-180"
                 dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y"
                 values="-60;-50;-70;-60"
                 dur="4s" repeatCount="indefinite"/>
    </rect>

    <circle cx="-60" cy="-60" r="60" class="shape">
        <animate attributeName="fill"
                 values="#0000ff;#00bcd4;#8000ff;#0000ff"
                 dur="5s" repeatCount="indefinite"/>
        <animate attributeName="r"
                 values="60;50;65;60"
                 dur="3s" repeatCount="indefinite"/>
    </circle>

    <ellipse cx="180" cy="-60" rx="120" ry="60" class="shape">
        <animate attributeName="fill"
                 values="#00cc99;#0066ff;#00ffcc;#00cc99"
                 dur="6s" repeatCount="indefinite"/>
        <animate attributeName="rx"
                 values="120;100;130;120"
                 dur="4s" repeatCount="indefinite"/>
        <animate attributeName="ry"
                 values="60;75;45;60"
                 dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <rect x="300" y="-120" width="60" height="60" class="shape">
        <animate attributeName="fill"
                 values="#ff00ff;#9900cc;#ff66cc;#ff00ff"
                 dur="5s" repeatCount="indefinite"/>
        <animate attributeName="x"
                 values="300;330;300;270;300"
                 dur="5s" repeatCount="indefinite"/>
        <animate attributeName="y"
                 values="-120;-90;-60;-90;-120"
                 dur="5s" repeatCount="indefinite"/>
    </rect>

    <rect x="-180" y="60" width="120" height="60" class="shape">
        <animate attributeName="fill"
                 values="#ff6600;#ffcc00;#cc3300;#ff6600"
                 dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y"
                 values="60;75;60;45;60"
                 dur="3s" repeatCount="indefinite"/>
        <animate attributeName="width"
                 values="120;100;130;120"
                 dur="4s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="60" width="60" height="60" class="shape">
        <animate attributeName="fill"
                 values="#9933ff;#cc66ff;#6600cc;#9933ff"
                 dur="5s" repeatCount="indefinite"/>
        <animate attributeName="height"
                 values="60;80;45;60"
                 dur="3s" repeatCount="indefinite"/>
    </rect>

    <circle cx="120" cy="60" r="60" class="shape">
        <animate attributeName="fill"
                 values="#ff3399;#ff6699;#cc0066;#ff3399"
                 dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cx"
                 values="120;140;100;120"
                 dur="5s" repeatCount="indefinite"/>
        <animate attributeName="r"
                 values="60;45;70;60"
                 dur="3s" repeatCount="indefinite"/>
    </circle>

    <rect x="180" y="60" width="60" height="60" class="shape">
        <animate attributeName="fill"
                 values="#00ccff;#0099cc;#66ffff;#00ccff"
                 dur="6s" repeatCount="indefinite"/>
        <animate attributeName="x"
                 values="180;200;180;160;180"
                 dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y"
                 values="60;50;60;70;60"
                 dur="4s" repeatCount="indefinite"/>
    </rect>

    <rect x="240" y="0" width="60" height="60" class="shape">
        <animate attributeName="fill"
                 values="#99cc00;#ccff00;#669900;#99cc00"
                 dur="5s" repeatCount="indefinite"/>
        <animate attributeName="width"
                 values="60;75;45;60"
                 dur="3s" repeatCount="indefinite"/>
        <animate attributeName="height"
                 values="60;45;75;60"
                 dur="3s" repeatCount="indefinite"/>
    </rect>

    <rect x="300" y="60" width="60" height="60" class="shape">
        <animate attributeName="fill"
                 values="#6633cc;#9966ff;#330099;#6633cc"
                 dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y"
                 values="60;80;60;40;60"
                 dur="4s" repeatCount="indefinite"/>
        <animate attributeName="width"
                 values="60;45;70;60"
                 dur="3s" repeatCount="indefinite"/>
    </rect>

    <text font-size="16" font-weight="bold" fill="#111">
        <textPath href="#textCurve"
                  startOffset="50%"
                  text-anchor="middle">
            Координатна площина та геометричні фігури (SVG)
        </textPath>
    </text>

</svg>

</body>
</html>
